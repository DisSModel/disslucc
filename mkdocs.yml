site_name: disslucc
site_url: https://dissmodel.github.io/disslucc/
repo_url: https://github.com/DisSModel/disslucc
repo_name: disslucc

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: green

markdown_extensions:
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Validation: validation.md
  - Decisions: decisions.md
  - Notebooks:
    - Continuous (CLUE): examples/notebooks/continuous_synthetic.ipynb
    - Discrete (CLUE-S): examples/notebooks/discrete_synthetic.ipynb
