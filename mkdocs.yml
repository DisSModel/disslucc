site_name: DisSLUCC
site_description: "Land use and cover change (LUCC) modeling on top of DisSModel: demand, potential and allocation, after LuccME."
site_author: "LambdaGeo / UFMA"
site_url: https://dissmodel.github.io/disslucc/
repo_url: https://github.com/DisSModel/disslucc
repo_name: DisSModel/disslucc
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - javascripts/mathjax-config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
  - Guides:
      - Notebooks:
          - Continuous (CLUE): examples/notebooks/continuous_synthetic.ipynb
          - Discrete (CLUE-S): examples/notebooks/discrete_synthetic.ipynb
  - Architecture:
      - Overview: architecture.md
      - Decisions: decisions.md
  - Reference:
      - API: api.md
  - Validation:
      - Agreement with TerraME/LuccME: validation.md
