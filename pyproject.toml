[project]
name = "disslucc"
version = "0.3.0"
description = "Land Use and Cover Change (LUCC) modeling — continuous and discrete allocation — on top of dissmodel."
readme = "README.md"
authors = [{ name = "Sergio Souza Costa", email = "sergio@ufma.br" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "dissmodel>=0.6.4,<0.7.0",
]

[project.optional-dependencies]
examples = ["matplotlib"]
dev = ["mypy>=1.10", "pytest>=7"]

[tool.mypy]
python_version = "3.11"
files = ["src/disslucc"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
