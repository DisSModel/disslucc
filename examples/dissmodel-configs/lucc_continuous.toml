# configs/models/lucc_continuous.toml
#
# Registers disslucc's LuccContinuousExecutor with dissmodel-platform.
# This is the SECOND entry point (docs/decisions.md) -- the default,
# script-first path (examples/run_script.py) needs none of this.
#
# Mirrors the convention in dissmodel-configs
# (https://github.com/DisSModel/dissmodel-configs/blob/main/models/
# lucc_continuous_vector.toml from disslucc-continuous), adapted to
# this package: disslucc is raster-only (no vector/raster split), so
# there is one executor -- LuccContinuousExecutor, name="lucc_continuous"
# -- not "lucc_vector"/"lucc_raster".
#
# Everything under [model] except [model.parameters] becomes part of
# record.resolved_spec on the platform and is merged into
# record.parameters before run() is called (see ModelExecutor.run()'s
# docstring in dissmodel/executor/model_executor.py: "Receives record
# with resolved_spec and parameters already merged"). LuccContinuousExecutor
# reads land_use_types/potential_data/static/complementar_lu/
# allocation_data directly from record.parameters -- see
# src/disslucc/executors/continuous.py and the equivalent hand-built
# ExperimentRecord in examples/run_lab1_via_executor.py, which this
# file is the TOML-registered version of (same Lab1 coefficients).
#
# NOTE: dissmodel's own *local* CLI (dissmodel.executor.cli.run_cli,
# `python -m disslucc.executors.continuous run --toml ...`) only lifts
# [model.parameters] into record.parameters -- it does NOT perform the
# resolved_spec merge described above. That merge is platform-side.
# So this file, as structured, is for registration in dissmodel-configs
# and execution via dissmodel-platform; it is not yet a drop-in
# --toml argument for local CLI runs of this executor. See
# docs/decisions.md for the open item this leaves.

[model]
executor_module  = "disslucc.executors"
name             = "lucc_continuous"
class            = "lucc_continuous"
description      = "LUCC continuous simulation (CLUE-like, linear regression potential)"
package          = "git+https://github.com/DisSModel/disslucc@main"
dissmodel        = ">=0.6.0,<0.7.0"

# Model-level config read from spec (record.resolved_spec["model"]),
# merged into record.parameters by the platform before run().
land_use_types   = ["f", "d", "outros"]
land_use_no_data = "outros"
complementar_lu  = "f"
cell_area        = 25.0
resolution       = 5000.0

[model.static]
f      = -1
d      = -1
outros = 1

# Runtime parameters (record.parameters).
# demand_csv must be supplied at experiment time -- no sensible default.
[model.parameters]
n_steps = 7

[[model.potential_data]]
lu    = "f"
const = 0.7392
  [model.potential_data.betas]
  assentamen = -0.2193
  uc_us      =  0.1754
  uc_pi      =  0.09708
  ti         =  0.1207
  dist_riobr =  0.0000002388
  fertilidad = -0.1313

[[model.potential_data]]
lu    = "d"
const = 0.267
  [model.potential_data.betas]
  rodovias   = -0.0000009922
  assentamen =  0.2294
  uc_us      = -0.09867
  dist_riobr = -0.0000003216
  fertilidad =  0.1281

[[model.potential_data]]
lu    = "outros"
const = 0.0

[[model.allocation_data]]
lu         = "f"
static     = -1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1

[[model.allocation_data]]
lu         = "d"
static     = -1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1

[[model.allocation_data]]
lu         = "outros"
static     = 1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1
