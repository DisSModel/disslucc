# LuccContinuousExecutor (CLUE-like, linear-regression potential) from a TOML file.
#
# Run it locally (data/input/csAC.zip is the region used in LuccME's Lab 1):
#
#   python -m disslucc.executors.continuous run \
#       --toml examples/dissmodel-configs/lucc_continuous.toml \
#       --input data/input/csAC.zip \
#       --param demand_csv=data/input/examples_demand_lab1.csv \
#       --output outputs/result.tif
#
# The same file registers the model in dissmodel-configs for dissmodel-platform.
# It is the declarative twin of examples/run_continuous_executor.py: same
# coefficients, and tests/test_executor_toml.py checks that both give the
# same output file (same SHA-256).
#
# Everything under [model] except [model.parameters] is merged into
# record.parameters before run(); [model.parameters] holds runtime values.

[model]
executor_module  = "disslucc.executors"
name             = "lucc_continuous"
class            = "lucc_continuous"
description      = "LUCC continuous simulation (CLUE-like, linear regression potential)"
package          = "git+https://github.com/DisSModel/disslucc@main"
dissmodel        = ">=0.6.0,<0.7.0"

# Model-level config read from spec (record.resolved_spec["model"]),
# merged into record.parameters by the platform before run().
land_use_types   = ["f", "d", "outros"]
land_use_no_data = "outros"
complementar_lu  = "f"
cell_area        = 25.0
resolution       = 5000.0

[model.static]
f      = -1
d      = -1
outros = 1

# Runtime parameters (record.parameters).
# demand_csv must be supplied at experiment time -- no sensible default.
[model.parameters]
n_steps = 7

[[model.potential_data]]
lu    = "f"
const = 0.7392
  [model.potential_data.betas]
  assentamen = -0.2193
  uc_us      =  0.1754
  uc_pi      =  0.09708
  ti         =  0.1207
  dist_riobr =  0.0000002388
  fertilidad = -0.1313

[[model.potential_data]]
lu    = "d"
const = 0.267
  [model.potential_data.betas]
  rodovias   = -0.0000009922
  assentamen =  0.2294
  uc_us      = -0.09867
  dist_riobr = -0.0000003216
  fertilidad =  0.1281

[[model.potential_data]]
lu    = "outros"
const = 0.0

[[model.allocation_data]]
lu         = "f"
static     = -1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1

[[model.allocation_data]]
lu         = "d"
static     = -1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1

[[model.allocation_data]]
lu         = "outros"
static     = 1
min_value  = 0
max_value  = 1
min_change = 0
max_change = 1
